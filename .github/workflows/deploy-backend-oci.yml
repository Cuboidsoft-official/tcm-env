name: Deploy Backend to OCI VM

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-oci.yml"
  workflow_dispatch:

concurrency:
  group: tcm-backend-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Sync backend source to VM
        env:
          OCI_USER: ${{ vars.BACKEND_USER || secrets.OCI_USER }}
          OCI_HOST: ${{ vars.BACKEND_HOST || secrets.OCI_HOST }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new "$OCI_USER@$OCI_HOST" \
            "sudo mkdir -p /opt/tcm/backend"
          rsync -avz --delete --delay-updates \
            --exclude 'node_modules' --exclude '.env' \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            ./backend/ "$OCI_USER@$OCI_HOST:/opt/tcm/backend/"

      - name: Provision backend .env from secret
        env:
          TCM_BACKEND_ENV: ${{ secrets.TCM_BACKEND_ENV }}
          OCI_USER: ${{ vars.BACKEND_USER || secrets.OCI_USER }}
          OCI_HOST: ${{ vars.BACKEND_HOST || secrets.OCI_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${TCM_BACKEND_ENV:-}" ]; then
            echo "TCM_BACKEND_ENV not set — skipping .env provisioning"
            exit 0
          fi
          printf '%s\n' "$TCM_BACKEND_ENV" > /tmp/tcm-backend.env
          scp -q -o StrictHostKeyChecking=accept-new /tmp/tcm-backend.env "$OCI_USER@$OCI_HOST:/tmp/tcm-backend.env"
          ssh -q -o StrictHostKeyChecking=accept-new "$OCI_USER@$OCI_HOST" \
            "sudo mv /tmp/tcm-backend.env /opt/tcm/backend/.env && sudo cp /opt/tcm/backend/.env /opt/tcm/.env && sudo chown root:root /opt/tcm/backend/.env /opt/tcm/.env && sudo chmod 600 /opt/tcm/backend/.env /opt/tcm/.env && echo 'ENV_WRITTEN'"

      - name: Install deps, restart service, verify health
        env:
          OCI_USER: ${{ vars.BACKEND_USER || secrets.OCI_USER }}
          OCI_HOST: ${{ vars.BACKEND_HOST || secrets.OCI_HOST }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new "$OCI_USER@$OCI_HOST" \
            "cd /opt/tcm/backend && npm ci --omit=dev --no-audit --no-fund && sudo systemctl restart tcm-backend && for i in \$(seq 1 60); do if body=\$(curl -fsS --max-time 5 http://127.0.0.1:5000/api/health 2>/dev/null); then if echo \"\$body\" | grep -q '\"ok\":true'; then echo 'HEALTH_OK after '\$i' polls: '\$body; exit 0; fi; fi; sleep 1.5; done; echo 'health check failed after 90s'; exit 1"

      - name: Report deployment status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DEPLOY_ENV: tcm-backend
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'error';
            const description = `Deploy to OCI backend (${context.sha.slice(0, 7)}): ${'${{ job.status }}'}`;
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: process.env.DEPLOY_ENV,
              auto_merge: false,
              required_contexts: [],
            }).catch((e) => { console.log(`createDeployment skipped: ${e.message}`); return null; });
            if (!dep) return;
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.data.id,
              state,
              description,
            }).catch((e) => { console.log(`createDeploymentStatus skipped: ${e.message}`); });
