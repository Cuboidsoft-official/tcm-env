name: Deploy Backend to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Containers
        run: npx wrangler deploy --config backend/wrangler.toml
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync MONGODB_URI secret
        if: env.MONGODB_URI != ''
        run: echo "$MONGODB_URI" | npx wrangler secret put MONGODB_URI --config backend/wrangler.toml

      - name: Sync JWT_SECRET secret
        if: env.JWT_SECRET != ''
        run: echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET --config backend/wrangler.toml

      - name: Sync GEMINI_API_KEY secret
        if: env.GEMINI_API_KEY != ''
        run: echo "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config backend/wrangler.toml
