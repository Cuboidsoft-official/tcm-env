name: TEMP extract OCI SSH key (delete after use)

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Print base64 of OCI_SSH_KEY (for local setup)
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          printf '%s' "$OCI_SSH_KEY" | base64 -w0
          echo
          echo "KEY_LEN=${#OCI_SSH_KEY}"
