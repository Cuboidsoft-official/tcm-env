name: Deploy Distribution Worker

on:
  push:
    branches:
      - main
    paths:
      - "dist-worker/**"
      - ".github/workflows/deploy-dist.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dist
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure R2 bucket exists
        id: r2
        run: |
          set +e
          npx wrangler r2 bucket create tcm-dist > /tmp/r2-bucket.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Bucket ready (created or already exists)."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif grep -q '10042' /tmp/r2-bucket.log; then
            echo "::warning::R2 is not enabled on the Cloudflare account yet - skipping the distribution worker deploy."
            echo "Enable R2 in the Cloudflare dashboard, then re-run this workflow to activate https://tcm-dist.cuboidsoft.workers.dev"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/r2-bucket.log >&2
            exit "$rc"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.r2.outputs.enabled == 'true'
        run: npx wrangler deploy --config dist-worker/wrangler.toml
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
