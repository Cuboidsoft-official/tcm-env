name: CI Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend health check (in-memory fallback)
        run: |
          set -e
          node backend/src/server.js > backend-server.log 2>&1 &
          NODE_PID=$!
          cleanup() {
            kill "$NODE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 8
          HEALTH=$(curl -fsS --max-time 15 http://localhost:5000/api/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"ok":true'

  frontend-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export Android bundle
        working-directory: frontend
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1
        run: npx expo export --platform android
