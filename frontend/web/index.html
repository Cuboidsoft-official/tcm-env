<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>TCM One - The Code Munk</title>
    
    <!-- PWA & Mobile Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5B3CF5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TCM One" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Expo Web Reset -->
    <style id="expo-reset">
      html {
        height: 100%;
        height: -webkit-fill-available;
      }
      body {
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        margin: 0;
        padding: 0;
        background-color: #0F172A;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      #root, #root > div {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        flex: 1;
      }
    </style>

    <!-- Global PWA Prompt Capture & Service Worker Auto-Registration -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        window.deferredPwaPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.deferredPwaPrompt = e;
          console.log('[PWA] Captured beforeinstallprompt event globally.');
          if (typeof window.onPwaPromptCaptured === 'function') {
            window.onPwaPromptCaptured(e);
          }
        });

        // Register Service Worker on Load
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
            }).catch(function(err) {
              console.warn('[PWA] ServiceWorker registration failed:', err);
            });
          });
        }
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run TCM One.</noscript>
    <div id="root"></div>
  </body>
</html>
