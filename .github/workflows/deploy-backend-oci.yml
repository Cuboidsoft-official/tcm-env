name: Deploy Backend to OCI VM

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-oci.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: tcm-backend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Sync backend source to VM
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new "$OCI_USER@$OCI_HOST" \
            "sudo mkdir -p /opt/tcm/backend"
          rsync -avz --delete --delay-updates \
            --exclude 'node_modules' --exclude '.env' \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            ./backend/ "$OCI_USER@$OCI_HOST:/opt/tcm/backend/"

      - name: Install deps, restart service, verify health
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new "$OCI_USER@$OCI_HOST" \
            "cd /opt/tcm/backend && npm ci --omit=dev --no-audit --no-fund && sudo systemctl restart tcm-backend && for i in \$(seq 1 30); do if curl -fsS --max-time 5 http://127.0.0.1:5000/api/health | grep -q '\"ok\":true'; then echo 'HEALTH_OK after '\$i' polls'; exit 0; fi; sleep 2; done; echo 'health check failed after 60s'; exit 1"
