name: CI Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci-checks.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci --workspace=backend

      - name: Backend health check (in-memory fallback)
        run: |
          set -e
          node backend/src/server.js > backend-server.log 2>&1 &
          NODE_PID=$!
          cleanup() {
            kill "$NODE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 15); do
            if curl -fsS --max-time 5 http://localhost:5000/api/health | grep -q '"ok":true'; then
              echo "HEALTH_OK after $i polls"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed after 30s"
          cat backend-server.log
          exit 1

  frontend-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --workspace=frontend

      - name: Export Android bundle
        working-directory: frontend
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_API_URL: ${{ vars.TCM_API_URL || 'https://api.thecodemunk.in/api' }}
        run: npx expo export --platform android
