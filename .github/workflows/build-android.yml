name: Build Android & Publish (EAS + R2 + Email)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/build-android.yml"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute app version
        run: echo "TCM_APP_VERSION=$(node -e "console.log(require('./frontend/app.json').expo.version)")" >> "$GITHUB_ENV"

      - name: Build APK (EAS preview)
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build AAB (EAS production)
        run: npx eas-cli@latest build --platform android --profile production --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download EAS artifacts (APK + AAB)
        run: |
          set -euo pipefail
          mkdir -p frontend/dist

          download_build() {
            local profile="$1"
            local outfile="$2"
            local json
            json="$(npx eas-cli@latest build:list --platform android --profile "$profile" --limit 1 --non-interactive --json)"
            local build_id
            build_id="$(echo "$json" | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].id)")"
            local build_url
            build_url="$(echo "$json" | node -e "console.log(JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].artifacts.buildUrl)")"
            echo "Profile '$profile' -> build $build_id"
            echo "Artifact URL: $build_url"
            npx eas-cli@latest build:download --build-id "$build_id" -o "$outfile"
          }

          download_build preview frontend/dist/app-preview.apk
          download_build production frontend/dist/app-release.aab

          ls -lh frontend/dist

      - name: Upload to R2
        run: node frontend/scripts/upload-to-r2.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tcm-android-build
          path: frontend/dist/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release (temporary hosting until R2 is enabled)
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="latest"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          gh release delete "$RELEASE_TAG" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            frontend/dist/app-preview.apk \
            frontend/dist/app-release.aab \
            --repo "$GITHUB_REPOSITORY" \
            --title "TCM Android Build ${{ env.TCM_APP_VERSION || '0.1.0' }}" \
            --notes "TCM Android APK + AAB build. App version: ${{ env.TCM_APP_VERSION || '0.1.0' }}."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Email APK + AAB links
        if: ${{ secrets.MAIL_APP_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: ${{ secrets.MAIL_TO || 'cuboidsoft@gmail.com' }}
          subject: TCM Android Build ${{ env.TCM_APP_VERSION || '0.1.0' }} ready (APK + AAB)
          body: |
            TCM Android build complete.

            App version: ${{ env.TCM_APP_VERSION || '0.1.0' }}

            Download links:
            - GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG || 'latest' }}
            - APK (R2): https://tcm-dist.cuboidsoft.workers.dev/apk/latest-release.apk
            - AAB (R2): https://tcm-dist.cuboidsoft.workers.dev/aab/latest-release.aab
            - Builds index (R2): https://tcm-dist.cuboidsoft.workers.dev/

            Note: GitHub Releases is the immediate download source. The R2 links activate once
            R2 is enabled in the Cloudflare dashboard.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
