name: VPS Hardening (apply security/optimization fixes)

on:
  workflow_dispatch:

jobs:
  harden:
    runs-on: ubuntu-latest
    concurrency:
      group: vps-hardening
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Apply hardening over SSH
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$OCI_USER@$OCI_HOST" 'sudo bash -s' <<'HARDEN'
          set -e
          echo "-- disable rpcbind (not needed, closes 0.0.0.0:111) --"
          systemctl disable --now rpcbind rpcbind.socket 2>/dev/null || true
          systemctl stop rpcbind rpcbind.socket 2>/dev/null || true
          systemctl mask rpcbind 2>/dev/null || true
          echo "-- lock Oracle default user opc --"
          usermod -s /usr/sbin/nologin opc 2>/dev/null || true
          echo "-- swappiness 10 (1GB RAM box) --"
          printf 'vm.swappiness=10\n' > /etc/sysctl.d/99-tcm.conf
          sysctl -p /etc/sysctl.d/99-tcm.conf >/dev/null
          echo "-- enable host firewall ufw (22/80/443) --"
          if ! command -v ufw >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq ufw
          fi
          ufw allow 22/tcp >/dev/null
          ufw allow 80/tcp >/dev/null
          ufw allow 443/tcp >/dev/null
          ufw --force enable
          ufw status verbose
          echo "-- verify app still healthy after hardening --"
          sleep 2
          curl -fsS --max-time 5 http://127.0.0.1:5000/api/health && echo
          systemctl is-active tcm-backend caddy
          echo "HARDENING_DONE"
          HARDEN
